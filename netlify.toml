[build]
  command = "pnpm build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Single-page app: unknown paths fall back to index.html (functions match first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. The page holds a Google token with read access to Drive,
# so the CSP only allows our own scripts plus Google sign-in, and only talks to
# Google's APIs. COOP keeps the sign-in popup able to report back.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.googleusercontent.com https://drive.google.com; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/ https://*.googleusercontent.com https://drive.usercontent.google.com; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Shared-collection pages are private links — keep them out of search engines.
[[headers]]
  for = "/s/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
